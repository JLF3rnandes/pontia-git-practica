name: Demo manual

on:
  workflow_dispatch:
    inputs:
      mensaje:
        description: "Mensaje que se imprimirá en la consola"
        required: true
        type: string

jobs:
  mostrar-mensaje:
    runs-on: ubuntu-latest
    steps:
      - name: Imprimir mensaje
        env:
          MENSAJE: ${{ inputs.mensaje }}
        run: echo "$MENSAJE"